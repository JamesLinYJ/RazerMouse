[package]
name = "razer-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
[lib]
crate-type = ["lib", "staticlib", "cdylib"]
[dependencies]
hidapi = { version = "2", features = ["macos-shared-device"] }
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rusb = { version = "0.9", features = ["vendored"] }
